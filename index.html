<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- ⚠ iOS paints the strip behind the clock/battery with theme-color. This is
       the value for «/» (the ink homepage — the landing route, so it is what a
       cold load must paint); App.jsx's <SystemChrome> flips it to the paper
       value on /catalog. Keep the two in sync with --color-ink / --color-paper. -->
  <meta name="theme-color" content="#0D0B09" />
  <!-- ⚠ iOS HOME-SCREEN (Web Clip): theme-color does NOTHING there. The status
       bar is controlled ONLY by apple-mobile-web-app-status-bar-style, and that
       tag is INERT unless -capable is "yes" — which is why the notch stayed
       white however dark the page got (Samir, Aug 16). "black" = an opaque dark
       bar on BOTH routes; "black-translucent" was rejected on purpose: it slides
       content under the clock and paints the glyphs white, which is invisible on
       the cream /catalog page. -capable=yes also makes the Web Clip launch
       standalone (no Safari chrome) — navigation stays whole: the wordmark goes
       home, the division pills go to the catalog, the modal closes with ✕. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Lightware" />
  <!-- declares which palettes the page really supports, so the UA paints its
       OWN surfaces (status-bar backdrop, overscroll) dark on the ink homepage
       instead of defaulting to light; App.jsx flips it per route -->
  <meta name="color-scheme" content="dark light" />
  <title>Lightware — إنارة معمارية فاخرة | Architectural Lighting</title>
  <meta name="description" content="Lightware — إنارة معمارية وثريات فاخرة في سوريا. ثريات، نوازل، إنارة جدارية وذكية. اطلب عبر واتساب. Premium architectural lighting in Syria — chandeliers, pendants, wall lights. Order via WhatsApp." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="canonical" href="https://www.lightwaresy.com/" />
  <!-- Open Graph. ⚠ WhatsApp caches unfurls per-URL aggressively: if og.jpg is
